<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloj</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #007fff; /* 🟦 Fondo azul */
    color: white;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    text-align: center;
    overflow: hidden;
{
    .reloj-agujas 
    width: 150px;
    height: 150px;
    border: 4px solid #FFD700; /* Borde dorado */
    border-radius: 50%;
    background: #0047ab; /* Azul más oscuro para que resalte */
    position: relative;
    margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); /* Brillo dorado */
}
    
.aguja {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    transform: rotate(0deg); /* <-- AGREGA ESTA LINEA */
    border-radius: 10px;
}
    
.aguja.hora {
    width: 6px;
    height: 35px;
    background: #ff4200; /* NARANJA */
    margin-left: -3px;
}
.aguja.minuto {
    width: 4px;
    height: 55px;
    background: #ffe000; /* AMARILLO */
    margin-left: -2px;
}
.aguja.segundo {
    width: 2px;
    height: 65px;
    background: #00ff16; /* VERDE */
    margin-left: -1px;
}
.centro {
    width: 14px;
    height: 14px;
    background: #FFD700; /* Centro dorado */
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
    
.fecha {
    color: #ffe000; /* 🟨 Amarillo */
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
    white-space: nowrap; /* Para que quede en 1 línea */
}
.reloj-completo { /* NUEVO: Juntamos todo aquí */
    color: #ff4200; /* 🟧 Naranja de tu paleta */
    font-size: 20vw; /* Bien grande */
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
}
.ampm {
    color: #00ff16; /* 🟩 Verde */
    font-size: 10vw;
    margin-top: 2vh;
    font-weight: 700;
}

    .saludo {
    font-size: 2em;
    font-weight: bold;
    margin-bottom: 10px;
    color: #FFFFFF;
    text-shadow: 0 0 10px #00BFFF;
}
    
.frase {
    font-size: 1.2em;
    margin-bottom: 20px;
    color: #FFD700;
    font-style: italic;
}
    
    footer {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 0.9em;
    color: #FFFFFF;
    opacity: 0.8;
    }
</style>
</head>
<body>

<div class="reloj-agujas">
    <div class="aguja hora" id="aguja-hora"></div>
    <div class="aguja minuto" id="aguja-minuto"></div>
    <div class="aguja segundo" id="aguja-segundo"></div>
    <div class="centro"></div>
</div>
    
<div class="fecha" id="fecha"></div>
<div class="reloj-completo" id="reloj-completo"></div> <!-- NUEVO: Todo en 1 línea -->
<div class="ampm" id="ampm"></div>
<div class="saludo" id="saludo"></div>
<div class="frase" id="frase"></div>
    
    <script>
    const frases = [ // <-- Lo moví para arriba para que ambas funciones lo vean
        "Hoy es un buen día para empezar algo nuevo",
        "Sonríe, la vida es hermosa",
        "Un paso a la vez y llegarás lejos",
        "Tu actitud determina tu día",
        "Cree en ti, puedes con todo",
        "Hoy va a pasarte algo increíble",
        "La paciencia trae grandes recompensas"
    ];

    // NUEVO: Esta función pone la primera letra en Mayúscula
    function capitalizar(texto) {
        const palabras = texto.split(' ');
        return palabras.map((palabra, i) => {
            if (palabra.toLowerCase() === 'de' && i !== 0) {
                return 'de';
            }
            return palabra.charAt(0).toUpperCase() + palabra.slice(1);
        }).join(' ');
    }

    function ponerSaludo() {
        const hora = new Date().getHours();
        const saludoDiv = document.getElementById('saludo');
        
        if (hora < 12) {
            saludoDiv.textContent = "¡Buenos días!";
        } else if (hora < 18) {
            saludoDiv.textContent = "¡Buenas tardes!";
        } else {
            saludoDiv.textContent = "¡Buenas noches!";
        }
    }

    function ponerFrase() {
        const hoy = new Date();
        const diaDelAno = Math.floor((hoy - new Date(hoy.getFullYear(), 0, 1)) / 86400000); // Versión segura
        const fraseDelDia = frases[diaDelAno % frases.length];
        document.getElementById('frase').textContent = fraseDelDia;
    }

    function actualizarReloj() {
        ponerSaludo(); // Llamar al inicio
        ponerFrase();  // Llamar al inicio

        const ahora = new Date();
        
        // Fecha en español
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fechaTexto = capitalizar(ahora.toLocaleDateString('es-ES', opciones));
        document.getElementById('fecha').innerHTML = fechaTexto;

        // Hora 12h
        let horas = ahora.getHours();
        const ampm = horas >= 12 ? 'PM' : 'AM';
        horas = horas % 12;
        horas = horas ? horas : 12;
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const segundos = String(ahora.getSeconds()).padStart(2, '0');

        // Todo junto en 1 línea
        document.getElementById('reloj-completo').innerHTML = `${horas}:${minutos}:${segundos}`;
        document.getElementById('ampm').innerHTML = ampm;
    }
        // Mover agujas del reloj analógico
    const deg = 6;
    const hr = ahora.getHours() % 12;
    const hrDeg = (hr * 30) + (ahora.getMinutes() / 2);
    const minDeg = ahora.getMinutes() * deg;
    const secDeg = ahora.getSeconds() * deg;
    
    document.getElementById('aguja-hora').style.transform = `rotate(${hrDeg}deg)`;
    document.getElementById('aguja-minuto').style.transform = `rotate(${minDeg}deg)`;
    document.getElementById('aguja-segundo').style.transform = `rotate(${secDeg}deg)`;
        }
        
    </script>
    
<footer>©️ 2026 @hevp23 | Héctor Eduardo Valladares Pérez</footer>
    
</body>
</html>
