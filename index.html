<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloj</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #007fff; /* 🟦 Fondo azul */
    color: white;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    text-align: center;
    overflow: hidden;
}
.fecha {
    color: #ffe000; /* 🟨 Amarillo */
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
    white-space: nowrap; /* Para que quede en 1 línea */
}
.reloj-completo { /* NUEVO: Juntamos todo aquí */
    color: #ff4200; /* 🟧 Naranja de tu paleta */
    font-size: 20vw; /* Bien grande */
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
}
.ampm {
    color: #00ff16; /* 🟩 Verde */
    font-size: 10vw;
    margin-top: 2vh;
    font-weight: 700;
}
</style>
</head>
<body>

<div class="fecha" id="fecha"></div>
<div class="reloj-completo" id="reloj-completo"></div> <!-- NUEVO: Todo en 1 línea -->
<div class="ampm" id="ampm"></div>

<script>
// NUEVO: Esta función pone la primera letra en Mayúscula
function capitalizar(texto) {
    return texto.charAt(0).toUpperCase() + texto.slice(1);
}
    
function actualizarReloj() {
    const ahora = new Date();
    
    // Fecha en español
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const fechaTexto = capitalizar(ahora.toLocaleDateString('es-ES', opciones)); // NUEVO: Ahora con mayúsculas
    document.getElementById('fecha').innerHTML = fechaTexto;
    
    // Hora 12h
    let horas = ahora.getHours();
    const ampm = horas >= 12 ? 'PM' : 'AM';
    horas = horas % 12;
    horas = horas ? horas : 12;
    
    const minutos = String(ahora.getMinutes()).padStart(2, '0');
    const segundos = String(ahora.getSeconds()).padStart(2, '0');
    
    // NUEVO: Todo junto en 1 línea
    document.getElementById('reloj-completo').innerHTML = `${horas}:${minutos}:${segundos}`;
    document.getElementById('ampm').innerHTML = ampm;
}

actualizarReloj();
setInterval(actualizarReloj, 1000); // Actualiza cada segundo
</script>

</body>
</html>
